<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>页面加载失败</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        color: #303133;
      }

      .card {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #ecf5ff;
        color: #409eff;
        font-size: 36px;
        line-height: 72px;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 20px;
        font-weight: 600;
      }

      p {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.6;
        color: #606266;
      }

      .url {
        margin: 12px 0 24px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #909399;
        word-break: break-all;
        text-align: left;
        background: #f5f7fa;
        border-radius: 8px;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      button {
        flex: 1;
        height: 40px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .btn-primary {
        color: #fff;
        background: #409eff;
      }

      .btn-secondary {
        color: #606266;
        background: #f4f4f5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">!</div>
      <h1>页面加载失败</h1>
      <p>网络异常或页面不存在，请检查后重试</p>
      <div class="url" id="failed-url">正在获取错误信息...</div>
      <div class="actions">
        <button class="btn-secondary" id="btn-back" type="button">返回</button>
        <button class="btn-primary" id="btn-retry" type="button">重新加载</button>
      </div>
    </div>

    <script>
      var failedUrl = "";

      function showFailedUrl(url) {
        var el = document.getElementById("failed-url");
        if (!el) return;
        if (url) {
          failedUrl = url;
          el.textContent = url;
        } else {
          el.textContent = "未获取到失败地址";
        }
      }

      function retryLoad() {
        if (failedUrl) {
          window.location.replace(failedUrl);
          return;
        }
        window.location.reload();
      }

      function goBack() {
        if (window.plus && plus.webview) {
          var current = plus.webview.currentWebview();
          if (current && current.canBack && current.canBack()) {
            current.back();
            return;
          }
          if (current && current.close) {
            current.close();
            return;
          }
        }
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        retryLoad();
      }

      document.getElementById("btn-retry").addEventListener("click", retryLoad);
      document.getElementById("btn-back").addEventListener("click", goBack);

      document.addEventListener(
        "error",
        function (e) {
          showFailedUrl(e.url || e.href || "");
        },
        false
      );

      window.addEventListener(
        "uniapperror",
        function (e) {
          var detail = e.detail || {};
          showFailedUrl(detail.url || detail.href || "");
        },
        false
      );
    </script>
  </body>
</html>
