# 项目管理系统 Nginx 配置文件
# 适用于 Vue 3 + Vite 构建的前端应用

# 定义上游服务器（后端 API 服务器）
# 如果后端 API 是独立服务，请取消注释并修改地址
# upstream backend_api {
#     server 127.0.0.1:8000;  # 后端 API 地址
#     # server 127.0.0.1:8001 backup;  # 备用服务器
#     keepalive 32;
# }

server {
    listen 8081;
    server_name 192.168.69.182;  # 修改为您的域名
    
    # 网站根目录（构建后的 dist 目录）
    root /var/www/project;
    index index.html;

    # 字符集
    charset utf-8;

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 客户端上传文件大小限制
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/x-icon;
    gzip_disable "MSIE [1-6]\.";

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # platform-config.json 配置文件（不缓存）
    location = /platform-config.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # API 代理配置（如果后端 API 是独立服务）
    # 请根据实际后端 API 路径修改
    location /api/ {
        
        # 如果后端 API 是独立服务，使用下面配置（请修改为实际后端地址）
        # proxy_pass http://127.0.0.1:8000;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA 路由支持 - 所有路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # 禁止访问敏感文件
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点（可选）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 404 错误处理
    error_page 404 /index.html;
}

