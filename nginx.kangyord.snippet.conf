# =============================================================================
# 项目管理系统 — 合并进 kangyord.lianhezloa.com 的 server { } 块
#
# 部署目录（构建产物）：
#   pnpm build:kangyord   # 读取 .env.kangyord
#   rsync dist/ → /var/www/pm-admin/dist/   （与 ky-admin 同级目录命名）
#
# 生产资料：接口返回相对路径 /data/xxx.jpg
#   - 页面拼接后一般为 https://域名/pm-api/data/xxx.jpg（走 pm-api 反代）
#   - 若 HTML/旧数据里是根路径 /data/xxx.jpg，需下方 location ^~ /data/
#
# 在现有 upstream 区域追加：
# =============================================================================

upstream pm_backend {
    # 内网后端（与开发环境 1137 端口一致，请按生产实际修改）
    server 172.31.16.2:1137;
    # 若仅映射公网端口，例如：server 118.145.215.227:11137;
    keepalive 32;
}

# =============================================================================
# 以下 location 插入到「官网 location /」之前（与其它子应用同级）
# =============================================================================

    # ==================== 项目管理系统 (/pm/ → /var/www/pm-admin/dist/) ====================

    location = /pm {
        return 301 /pm/;
    }

    location = /pm/ {
        rewrite ^ /pm/index.html last;
    }

    location = /pm/index.html {
        alias /var/www/pm-admin/dist/index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /pm/platform-config.json {
        alias /var/www/pm-admin/dist/platform-config.json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /pm/static/ {
        alias /var/www/pm-admin/dist/static/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # favicon、logo 等（Vite public 根下资源）
    location ~* ^/pm/.+\.(?:png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|map|gz)$ {
        rewrite ^/pm/(.*)$ /$1 break;
        root /var/www/pm-admin/dist;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ==================== 项目管理生产资料 (/data/ → 1137) ====================
    # 与内网 http://IP:1137/data/xxx 一致；避免命中官网 location /

    location ^~ /data/ {
        proxy_pass http://pm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        client_max_body_size 500m;
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public" always;
    }

    # ==================== 项目管理 API (/pm-api/ → 1137) ====================
    # 勿占用 /api/（WOMS 已用）。前端 axios baseURL 指向同域 /pm-api

    location = /pm-api {
        return 301 /pm-api/;
    }

    location = /pm-api/user/login {
        limit_req zone=kangyord_login burst=3 nodelay;
        limit_conn kangyord_conn 10;

        proxy_pass http://pm_backend/user/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location ^~ /pm-api/ {
        limit_req zone=kangyord_api burst=100 nodelay;
        limit_conn kangyord_conn 50;

        proxy_pass http://pm_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # 上传/下载生产资料（/pm-api/data/...，与接口返回的 /data/ 路径对应）
    location ^~ /pm-api/data/ {
        limit_req zone=kangyord_api burst=100 nodelay;
        limit_conn kangyord_conn 50;

        proxy_pass http://pm_backend/data/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        client_max_body_size 500m;
        expires 1d;
        add_header Cache-Control "public" always;
    }
